# .mise.toml — LabNexus Sprint 1 (Go CLI)
# Generated by vibbly init, riadattato per LabNexus.

[tools]
go = "1.22"
# Nota: niente `goose` (strumento migrazioni DB). LabNexus è un CLI puro
# filesystem (02-project.md: Database Choice → Engine: none, ORM: none).
#
# `golangci-lint` non è gestito da mise: il backend aqua interroga GitHub API
# e va in 401 per rate-limit. Installalo separatamente:
#   macOS:  brew install golangci-lint
#   linux:  https://golangci-lint.run/welcome/install/#binaries
#   oppure: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
# Verifica: `golangci-lint --version` (atteso ≥ 2.0).

[env]
CGO_ENABLED = "0"
