  # --- Git hooks ---
  hooks:
    - path: ".git/hooks/pre-commit"
      source: ".hooks/pre-commit.sh"
      description: "Pre-commit quality gate"

  # --- Git repository ---
  git:
    - check: "is_repo"
      command: "git rev-parse --git-dir"
      required: true
      description: "Project is a git repository"

    - check: "branch_main_exists"
      command: "git show-ref --verify refs/heads/main"
      required: true
      description: "Branch 'main' exists (production)"

    - check: "branch_development_exists"
      command: "git show-ref --verify refs/heads/development"
      required: true
      description: "Branch 'development' exists (working branch)"

    - check: "current_branch_not_main"
      command: "test $(git branch --show-current) != 'main'"
      required: false
      description: "Not on main branch (agents should work on development or feature branches)"

    - check: "remote_configured"
      command: "git remote get-url origin"
      required: false
      description: "Git remote 'origin' configured"

