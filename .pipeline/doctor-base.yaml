# .pipeline/doctor.yaml
# Declarative specification of what `vibbly doctor` verifies.
# Generated by vibbly init from the stack template. Edit freely.
#
# Check types:
#   runtime:  managed by mise, verified via `mise which <tool>`
#   tool:     expected in PATH, not managed by mise
#   file:     expected to exist in the project
#   command:  arbitrary shell command that must succeed (exit 0)

checks:

  # --- Runtime (mise-managed) ---
  # These are declared in .mise.toml and verified by `mise doctor` internally.
  # vibbly doctor runs `mise install --dry-run` to detect missing versions.
  runtime:
    source: ".mise.toml"

  # --- Pipeline files ---
  files:
    - path: "CLAUDE.md"
      required: true
      description: "Builder agent context"
    - path: "REVIEWER.md"
      required: false
      description: "External reviewer instructions"
    - path: ".pipeline/config.sh"
      required: true
      description: "Pipeline configuration"
    - path: ".pipeline/standards/00-principles.md"
      required: true
      description: "Core principles"
    - path: ".pipeline/standards/01-methodology.md"
      required: true
      description: "Development methodology"
    - path: ".pipeline/standards/02-project.md"
      required: true
      description: "Project-specific standards"

  # --- External tools (not mise-managed) ---
  tools:
    - name: "git"
      command: "git --version"
      required: true

    - name: "gemini"
      command: "gemini --version"
      required: false
      config_key: "REVIEWER_GEMINI_ENABLED"
      install_hint:
        macos: "npm install -g @google/gemini-cli"
        linux: "npm install -g @google/gemini-cli"

    - name: "vibe (mistral)"
      command: "vibe --version"
      required: false
      config_key: "REVIEWER_MISTRAL_ENABLED"
      install_hint:
        macos: "curl -LsSf https://mistral.ai/vibe/install.sh | bash"
        linux: "curl -LsSf https://mistral.ai/vibe/install.sh | bash"

    - name: "ollama"
      command: "ollama --version"
      required: false
      config_key: "REVIEWER_OLLAMA_ENABLED"
      install_hint:
        macos: "brew install ollama"
        linux: "curl -fsSL https://ollama.ai/install.sh | sh"

    - name: "claude"
      command: "claude --version"
      required: false
      install_hint:
        macos: "npm install -g @anthropic-ai/claude-code"
        linux: "npm install -g @anthropic-ai/claude-code"

    - name: "codex"
      command: "codex --version"
      required: false
      config_key: "REVIEWER_CODEX_ENABLED"
      install_hint:
        macos: "npm install -g @openai/codex"
        linux: "npm install -g @openai/codex"

    - name: "pandoc"
      command: "pandoc --version"
      required: false
      description: "PDF report generation from Markdown (/report)"
      install_hint:
        macos: "brew install pandoc"
        linux: "sudo apt install pandoc"

