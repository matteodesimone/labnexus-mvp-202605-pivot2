# labnexus.config.toml — Configurazione master Sprint 1.5.B (post-pivot-3).
# Editato da Denis dopo aver estratto lo zip. Almeno `eurouter_api_key` va riempito.
#
# I 7 profili in profili/*.toml ereditano questi defaults se non specificano
# il campo localmente. Override locale del profile prevale sul master.

# Provider LLM di default. Cloud EU-GDPR via eurouter (Sprint 1.5 default
# post-pivot-3, cliente Stefano Fiorina approvato). Override locale possibile
# nel profile o via CLI/env (--provider, LABNEXUS_PROVIDER).
provider = "eurouter"

# Modello di default. Qwen 3.5 family, thinking mode, 262K context.
# Sprint 1.5.C update post-smoke CTO: era "qwen3.6" (nome Ollama-style Sprint 1)
# ma eurouter non lo riconosce. Sostituito con Qwen3.5 122B A10B (MoE 122B totali /
# 10B activated, 262K context, thinking+tools+JSON, $0.50/$3.50 per Mtok). Match
# scelto per task ispettivi che richiedono ragionamento profondo (review-pack
# annuale, competence-gap multi-tecnico, pt-analysis con z-score).
# Per cambiare modello, consulta il catalogo su https://api.eurouter.ai/api/v1/models
# o il dashboard eurouter (filtro qwen).
# modello = "qwen3.5-122b-a10b"
modello = "llama-4-maverick"
# modello = "kimi-k2.6"

# Parametri LLM di default. context_window = 256000: è il limite REALMENTE applicato
# dal gateway eurouter (HTTP 400 "exceeds model context window (256000)"), più stretto
# del 262144 del modello kimi dietro. Serve alla stima locale e al calcolo del budget
# di output; non è un parametro OpenAI-compatible inviato al modello.
#
# temperature: kimi-k2.6 ha temperatura FISSA 1.0 (doc Moonshot) — usare 1.0.
#
# max_tokens: kimi-k2.6 è un modello "thinking" → reasoning_content e content
# CONDIVIDONO max_tokens; Moonshot raccomanda >= 16000 e nell'esempio ufficiale usa
# 32768. DEFAULT = 32768: valore statico sano che copre reasoning+content insieme
# (massimo combinato osservato sui 7 test reali: ~27000) e fa entrare tutte le
# capability al primo colpo. Se il prompt reale + 32768 dovesse sforare il limite del
# modello, labnexus ricalcola sul conteggio ESATTO del provider e riprova (backstop,
# log pulito); se non resta spazio per i 16000 minimi → errore chiaro a schermo+log.
# I 7 profili ereditano questo valore (non definiscono max_tokens).
#
# 0 = AUTO (alternativa, algoritmo intatto): labnexus calcola context − stima_prompt
# − buffer (densità reale kimi ~3,2 char/tok), output massimo adattivo — ma sugli
# input piccoli chiede molto più del necessario. NON lasciare vuoto/omesso: il
# default documentato eurouter/Moonshot è ~1024 → un thinking lo esaurisce nel
# reasoning e torna VUOTO.
temperature = 0.5
max_tokens = 32768
context_window = 256000

# Chiave API per eurouter. Denis la riempie qui dopo lo zip extract.
# In alternativa, può essere passata come env var EUROUTER_API_KEY (precedenza env > master).
eurouter_api_key = ""

# Endpoint Ollama per chi usa il provider locale opzionale.
# Default: http://localhost:11434 (override via env LABNEXUS_OLLAMA_ENDPOINT).
ollama_endpoint = "http://localhost:11434"

# Tuning anti-stallo dello streaming (opzionali). Lasciali commentati per usare i
# default del codice; servono quando eurouter è lento/degradato.
#   stream_idle_timeout_sec: secondi di silenzio totale (nessun token NÉ reasoning)
#     oltre i quali lo stream è considerato in stallo, interrotto e ritentato
#     (default 180). Il TTFT normale osservato è ~1-2 min → 180 non falsa un warmup
#     lento; alza se eurouter è abitualmente più lento.
#   stream_max_retries: retry su stallo a METÀ generazione o output vuoto (default 2).
#     Lo stallo PRIMA del primo token (provider giù) usa sempre 1 solo retry, per
#     fallire in fretta con un messaggio chiaro invece di sprecare minuti.
# stream_idle_timeout_sec = 180
# stream_max_retries = 2

# Sprint 1.5.D: generazione PDF accoppiato all'output MD.
# Default attivo per tutte le 7 capability. Override per-capability nel
# _labnexus.toml della cartella (sezione [pdf] enabled = false). Override
# massimo: flag CLI --pdf / --pdf=false (per-run).
[pdf]
enabled = true

# Sprint 1.5.D: generazione DOCX accoppiato all'output MD per L2 validation
# Denis con Word (track changes, comments). Stessa gerarchia di [pdf]:
# master qui → _labnexus.toml [docx] enabled per-capability → flag --docx CLI.
[docx]
enabled = true
