# labnexus.config.toml — Configurazione master Sprint 1.5.B (post-pivot-3).
# Editato da Denis dopo aver estratto lo zip. Almeno `eurouter_api_key` va riempito.
#
# I 7 profili in profili/*.toml ereditano questi defaults se non specificano
# il campo localmente. Override locale del profile prevale sul master.

# Provider LLM di default. Cloud EU-GDPR via eurouter (Sprint 1.5 default
# post-pivot-3, cliente Stefano Fiorina approvato). Override locale possibile
# nel profile o via CLI/env (--provider, LABNEXUS_PROVIDER).
provider = "eurouter"

# Modello di default. Qwen 3.5 family, thinking mode, 262K context.
# Sprint 1.5.C update post-smoke CTO: era "qwen3.6" (nome Ollama-style Sprint 1)
# ma eurouter non lo riconosce. Sostituito con Qwen3.5 122B A10B (MoE 122B totali /
# 10B activated, 262K context, thinking+tools+JSON, $0.50/$3.50 per Mtok). Match
# scelto per task ispettivi che richiedono ragionamento profondo (review-pack
# annuale, competence-gap multi-tecnico, pt-analysis con z-score).
# Per cambiare modello, consulta il catalogo su https://api.eurouter.ai/api/v1/models
# o il dashboard eurouter (filtro qwen).
# modello = "qwen3.5-122b-a10b"
modello = "kimi-k2.6"

# Parametri LLM di default. context_window = 256K (= 262144), il context reale
# di kimi-k2.6: serve SOLO alla stima locale "il prompt ci sta?", non viene
# inviato al modello (non è un parametro OpenAI-compatible).
#
# temperature: kimi-k2.6 ha temperatura FISSA 1.0 (doc Moonshot) — usare 1.0.
#
# max_tokens: kimi-k2.6 è un modello "thinking" → reasoning_content e content
# CONDIVIDONO max_tokens; Moonshot raccomanda >= 16000. Qui sta alto (128K) ma
# il motore lo restringe in automatico a (context - prompt - margine), così non
# tronca mai per un valore fisso troppo basso, qualunque sia la dimensione
# dell'input. Metti 0 per "auto puro" (tutto il budget disponibile, senza tetto).
temperature = 1.0
max_tokens = 131072
context_window = 262000

# Chiave API per eurouter. Denis la riempie qui dopo lo zip extract.
# In alternativa, può essere passata come env var EUROUTER_API_KEY (precedenza env > master).
eurouter_api_key = ""

# Endpoint Ollama per chi usa il provider locale opzionale.
# Default: http://localhost:11434 (override via env LABNEXUS_OLLAMA_ENDPOINT).
ollama_endpoint = "http://localhost:11434"

# Sprint 1.5.D: generazione PDF accoppiato all'output MD.
# Default attivo per tutte le 7 capability. Override per-capability nel
# _labnexus.toml della cartella (sezione [pdf] enabled = false). Override
# massimo: flag CLI --pdf / --pdf=false (per-run).
[pdf]
enabled = true

# Sprint 1.5.D: generazione DOCX accoppiato all'output MD per L2 validation
# Denis con Word (track changes, comments). Stessa gerarchia di [pdf]:
# master qui → _labnexus.toml [docx] enabled per-capability → flag --docx CLI.
[docx]
enabled = true
