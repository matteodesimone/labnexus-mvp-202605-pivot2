trigger_prompt = """
Sulla base della tua identità di system context, esegui questo compito.
Input: risk register del laboratorio (CSV con voci di rischio per area ISO
17025) e una descrizione di scope d'audit (md).
Produci una checklist d'audit operativa: tra 15 e 30 domande ispettive,
raggruppate in 3-6 aree (heading "### Area …") coerenti con lo scope.
Per OGNI area indica i "campioni documentali" da richiedere e il "livello
di rischio" ereditato dal risk register. Le domande devono tradurre rischi
specifici, non essere generiche. Tono ispettivo. Frontmatter YAML completo.
"""

