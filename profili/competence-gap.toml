# Profilo "competence-gap" (Capability F) — Sprint 1.5.B (TOML).
# Provider/modello/parametri ereditati dal master.

profilo = "competence-gap"
descrizione = "Competence Gap Report — gap competenze tecnici per procedura/metodo nuovo, con piano formazione e autorizzazioni da rilasciare/aggiornare"

# Sprint 1.5.E — rimappato sul KB-ispettore v2.1 (refactor flat → cartelle numerate).
# Mappatura "ampio": core di sistema + mappa + § 6 Risorse completo (ex monolite sezione-6).
kb_files = [
  # Core "sempre in contesto" (rimpiazza il vecchio CLAUDE.md)
  "00_INDICE.md",
  "00_FONTI_NORMATIVE.md",
  "00_GLOSSARIO.md",
  "01_SYSTEM/01_PERSONA_aicertus.md",
  "01_SYSTEM/02_PROTOCOLLO_ASK_BEFORE_ANSWER.md",
  "01_SYSTEM/03_PROTOCOLLO_HANDOFF_QM.md",
  "01_SYSTEM/04_PROTOCOLLO_CITAZIONI.md",
  "01_SYSTEM/05_TRE_LIVELLI_CONFIDENZA.md",
  "01_SYSTEM/06_GOVERNANCE_AI.md",
  # Logica ispettiva (ex come-pensa + NC-patterns)
  "02_LOGICA_ISPETTIVA/01_COME_PENSA_ISPETTORE.md",
  "02_LOGICA_ISPETTIVA/03_RISPOSTA_NC.md",
  # Mappa requisiti (ex MAPPA_ESPLOSA_REQUISITI_ISO17025)
  "03_REQUISITI/00_MAPPA_ESPLOSA.md",
  # § 6 Risorse — blocco completo (ex sezione-6); 6.2 personale è il cuore del profilo
  "03_REQUISITI/sez_6_1_risorse_generali.md",
  "03_REQUISITI/sez_6_2_personale.md",
  "03_REQUISITI/sez_6_3_strutture_ambiente.md",
  "03_REQUISITI/sez_6_4_dotazioni.md",
  "03_REQUISITI/sez_6_5_riferibilita.md",
  "03_REQUISITI/sez_6_6_prodotti_servizi_esterni.md",
]

trigger_prompt = """
Sulla base della tua identità di system context, esegui questo compito.
Input: matrice competenze del laboratorio (CSV con tecnici × metodi/procedure
e valori autorizzato/non-autorizzato/in-qualifica) + descrizione di una
procedura o metodo NUOVO da introdurre.
Produci un Competence Gap Report in 4 sezioni heading "## " coerenti col
CompetenceAgent (CoWork KB sez. 7.7): (1) tecnici autorizzabili in priorità
per competenze adiacenti già presenti, (2) tecnici non autorizzabili / gap
ampio, (3) piano formazione con tempistiche concrete (date ISO o Q-YYYY o
settimane/mesi), (4) autorizzazioni da rilasciare o aggiornare in matrice.
Cita SOLO nomi tecnici presenti nella matrice. NON inventare persone.
Tono ispettivo, frontmatter YAML completo.
"""

[output.frontmatter_default]
tipo = "competence_gap_report"
stato_qm = "bozza_da_validare_qm"
profilo_labnexus = "competence-gap"
