# Profilo: competence-gap (Capability F — gap report competenze + piano formazione + autorizzazioni)
# Fetta 3 dello Sprint 1 (FR-18). Template di riferimento: CoWork KB sez. 7.7
# (TEMPLATE_Competence_Confidentiality_Report) — agente CompetenceAgent.
profilo: competence-gap
descrizione: Competence Gap Report — gap competenze tecnici per procedura/metodo nuovo, con piano formazione e autorizzazioni da rilasciare/aggiornare

provider: eurouter
modello: qwen3.6

temperature: 0.9
max_tokens: 8192
context_window: 128000

kb_files:
  - CLAUDE.md
  - come-pensa-un-ispettore.md
  - MAPPA_ESPLOSA_REQUISITI_ISO17025.md
  - sezioni-ISO/sezione-6-risorse-personale-dotazioni-domande.md
  - NC-patterns/come-rispondere-NC-ACCREDIA.md

trigger_prompt: |
  Sulla base della tua identità di system context, esegui questo compito.
  Input: matrice competenze del laboratorio (CSV con tecnici × metodi/procedure
  e valori autorizzato/non-autorizzato/in-qualifica) + descrizione di una
  procedura o metodo NUOVO da introdurre.
  Produci un Competence Gap Report in 4 sezioni heading "## " coerenti col
  CompetenceAgent (CoWork KB sez. 7.7): (1) tecnici autorizzabili in priorità
  per competenze adiacenti già presenti, (2) tecnici non autorizzabili / gap
  ampio, (3) piano formazione con tempistiche concrete (date ISO o Q-YYYY o
  settimane/mesi), (4) autorizzazioni da rilasciare o aggiornare in matrice.
  Cita SOLO nomi tecnici presenti nella matrice. NON inventare persone.
  Tono ispettivo, frontmatter YAML completo.

input:
  pattern_attesi:
    - "matrice competenze (CSV con tecnici × metodi/procedure)"
    - "descrizione procedura/metodo nuovo (md)"
  istruzioni_se_mancante: |
    Per il Competence Gap Report servono la matrice competenze del laboratorio
    + la descrizione della procedura o metodo nuovo da introdurre.

output:
  frontmatter_default:
    tipo: competence_gap_report
    stato_qm: bozza_da_validare_qm
    profilo_labnexus: competence-gap
