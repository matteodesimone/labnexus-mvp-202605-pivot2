# Profilo: review-pack (Capability C — Management Review Pack annuale)
# Fetta 2 dello Sprint 1 (FR-15). Template di riferimento: CoWork KB sezione 15.4.
profilo: review-pack
descrizione: Riesame annuale della Direzione — Management Review Pack a 13 sezioni con sintesi iniziale coerente con le decisioni finali

provider: ollama
modello: qwen3.6

temperature: 0.9
max_tokens: 8192
context_window: 128000

kb_files:
  - CLAUDE.md
  - come-pensa-un-ispettore.md
  - MAPPA_ESPLOSA_REQUISITI_ISO17025.md
  - sezioni-ISO/sezione-8-sgq-domande.md
  - NC-patterns/come-rispondere-NC-ACCREDIA.md
  - NC-patterns/errori-fatali-da-evitare.md

trigger_prompt: |
  Sulla base della tua identità di system context, esegui questo compito.
  Input: pacchetto annuale di evidenze del laboratorio (NC, audit interni,
  reclami, PT con z-score, apparecchiature, KPI).
  Produci il Management Review Pack del CoWork KB sezione 15.4: markdown con
  esattamente 13 sezioni numerate "## 1." → "## 13." preceduto da una sezione
  "Sintesi iniziale" coerente con le decisioni finali del Pack (sezione 13).
  Tono ispettivo, riferimenti documentali espliciti, no requisiti normativi
  non presenti negli input. Frontmatter YAML completo.

input:
  pattern_attesi:
    - "NC dell'anno (CSV o md)"
    - "esiti audit interni (md)"
    - "reclami (CSV)"
    - "risultati proficiency testing con z-score (CSV)"
    - "stato apparecchiature (CSV)"
    - "indicatori di prestazione / KPI (md)"
  istruzioni_se_mancante: |
    Per il Management Review Pack servono evidenze annuali del laboratorio:
    NC, audit interni, reclami, PT, apparecchiature, KPI. Almeno 3 di queste
    famiglie devono essere presenti per produrre un Pack significativo.

output:
  frontmatter_default:
    tipo: management_review_pack
    stato: bozza_da_validare_qm
    profilo_labnexus: review-pack
    locale: true
