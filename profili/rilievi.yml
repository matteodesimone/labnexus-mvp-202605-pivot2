# Profilo: rilievi (Capability B — gestione rilievi Accredia / CAPAAgent)
# Sub-fetta 1.C dello Sprint 1, shakedown motore #2 (FR-14).
profilo: rilievi
descrizione: Gestione rilievi Accredia (NC, Osservazioni, Commenti) — produce un CAPA Pack per ogni rilievo

provider: ollama
modello: qwen3.6

temperature: 0.9
max_tokens: 8192
context_window: 128000

kb_files:
  - CLAUDE.md
  - come-pensa-un-ispettore.md
  - NC-patterns/come-rispondere-NC-ACCREDIA.md
  - NC-patterns/errori-fatali-da-evitare.md

trigger_prompt: |
  Sulla base della tua identità e delle regole definite nei file di system context
  che hai appena letto, esegui ora questo compito specifico.

  Ti viene fornito un file nella cartella di input: un CSV con la lista dei rilievi
  emessi a un audit Accredia. Le colonne tipiche sono: codice rilievo, tipologia
  (NC | Osservazione | Commento), sezione normativa, testo del rilievo, eventuali note.

  Per ogni rilievo del CSV produci un blocco CAPA Pack secondo il template
  definito nel CoWork KB sezione 15.2. Ogni blocco deve riportare:
  - meccanismo (cosa è successo nel processo)
  - estensione (perimetro impattato)
  - efficacia (come verifichiamo che la correzione/azione regge)
  - esplicitamente: basta una correzione oppure serve anche una azione correttiva?

  Tono ispettivo, no checklist astratte. Non inventare codici di sezioni che non
  sono nei dati di input. Frontmatter YAML completo. Output markdown.

input:
  pattern_attesi:
    - "CSV dei rilievi (Accredia, formato tipo ACIAA)"
  istruzioni_se_mancante: |
    Per la gestione rilievi serve almeno un CSV con la lista dei rilievi emessi.

output:
  frontmatter_default:
    tipo: capa_pack
    stato_qm: bozza_da_validare_qm
    profilo_labnexus: rilievi
    locale: true
